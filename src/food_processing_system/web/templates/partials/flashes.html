{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="px-5 lg:px-8 pt-4 space-y-2">
    {% for category, message in messages %}
    <div class="rounded-xl px-4 py-3 text-sm {{ 'bg-red-100 text-red-800 dark:bg-red-500/15 dark:text-red-300' if category=='error' else 'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/15 dark:text-emerald-300' }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
