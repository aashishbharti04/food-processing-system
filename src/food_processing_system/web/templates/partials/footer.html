<footer class="mt-auto border-t border-slate-200 dark:border-slate-800 px-5 lg:px-8 py-6 text-sm text-slate-500 dark:text-slate-400">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div>
      <p class="font-semibold text-slate-700 dark:text-slate-300">{{ footer.project }}</p>
      <p>Contact: <a class="text-amber-600 hover:underline" href="mailto:{{ footer.email }}">{{ footer.email }}</a></p>
    </div>
    <div class="flex flex-wrap items-center gap-x-4 gap-y-1">
      {% for label, url in footer.links.items() %}
      <a href="{{ url }}" target="_blank" rel="noopener noreferrer" class="hover:text-amber-600 transition">{{ label }}</a>
      {% endfor %}
    </div>
  </div>
  <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-800/60 text-xs">
    <p>© {{ footer.project }}. All rights reserved.</p>
    <p>This project is open source and available for educational, learning, and community contributions.</p>
  </div>
</footer>
