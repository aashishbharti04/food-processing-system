<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{% block description %}Food Processing System — order food and manage customers and orders.{% endblock %}" />
  <title>{% block title %}Food Processing System{% endblock %}</title>

  <!-- Apply the saved theme before paint to avoid a flash. -->
  <script>
    (function () {
      const t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(120,120,120,.4); border-radius: 9999px; }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 antialiased">
{% block body %}{% endblock %}
<script>
  document.addEventListener('click', function (e) {
    const tt = e.target.closest('#themeToggle');
    if (tt) {
      const root = document.documentElement;
      root.classList.toggle('dark');
      localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
    }
    const nt = e.target.closest('#navToggle');
    if (nt) { document.getElementById('navLinks')?.classList.toggle('hidden'); }
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
