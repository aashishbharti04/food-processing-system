{% extends "layouts/plain.html" %}
{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="min-h-screen grid place-items-center p-6">
  <div class="text-center">
    <p class="text-7xl font-extrabold text-amber-500">{{ code }}</p>
    <p class="mt-2 text-lg font-semibold">{{ message }}</p>
    <a href="{{ url_for('customer.home') }}" class="mt-6 inline-block rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 text-white font-semibold px-5 py-2.5 shadow-lg shadow-orange-500/30">Go home</a>
  </div>
</div>
{% endblock %}
